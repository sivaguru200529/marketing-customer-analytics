[loggers]
keys=root,auraRetail

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=auraFormatter

[logger_root]
level=INFO
handlers=consoleHandler

[logger_auraRetail]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=auraRetail
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=auraFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=DEBUG
formatter=auraFormatter
args=('aura_retail.log', 'a')

[formatter_auraFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(filename)s:%(lineno)d - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
