version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aura_retail_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
      POSTGRES_DB: aura_retail_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aura_retail_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aura_retail_network

  pgadmin:
    image: dpage/pgadmin4:8.3
    container_name: aura_retail_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@auraretail.com
      PGADMIN_DEFAULT_PASSWORD: admin_secure_password
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aura_retail_network

volumes:
  postgres_data:
    driver: local

networks:
  aura_retail_network:
    driver: bridge
